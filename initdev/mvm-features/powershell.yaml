setup: |
  set -e
  export DEBIAN_FRONTEND=noninteractive
  case "$(uname -m)" in
    x86_64) arch=x64 ;;
    aarch64) arch=arm64 ;;
    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
  esac
  icu="$(apt-cache pkgnames libicu | grep -E '^libicu[0-9]+$' | sort -V | tail -n 1)"
  apt-get install -y --no-install-recommends less locales "${icu}"
  tag="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/PowerShell/PowerShell/releases/latest)"
  version="${tag##*/v}"
  rm -rf /opt/microsoft/powershell
  mkdir -p /opt/microsoft/powershell
  curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v${version}/powershell-${version}-linux-${arch}.tar.gz" | tar -xz -C /opt/microsoft/powershell
  chmod +x /opt/microsoft/powershell/pwsh
  ln -sf /opt/microsoft/powershell/pwsh /usr/local/bin/pwsh
